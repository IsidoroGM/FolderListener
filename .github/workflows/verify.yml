name: Verify and build native artifacts
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.11'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --junitxml=dist/test-results.xml
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/build.py
          python scripts/smoke.py dist/FolderLister.exe
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - if: runner.os == 'Linux'
        run: PYTHON=python bash scripts/build-linux.sh
      - if: runner.os == 'macOS'
        run: PYTHON=python bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: folderlister-${{ matrix.os }}
          path: dist/
