[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "folderlister"
version = "1.0.0"
description = "Inventario local de carpetas y archivos en TXT y Excel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["openpyxl==3.1.5", "et-xmlfile==2.0.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.2", "pyinstaller==6.16.0", "build==1.3.0"]

[project.scripts]
folderlister = "folderlister.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
